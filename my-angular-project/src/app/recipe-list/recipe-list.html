<div>
    <div style="margin-bottom: 2rem;">
        @for (r of recipes; track r.id) {
            <button (click)="recipe.set(r)" style="margin-right: 1rem;">
                {{ r.name }}
                @if (r.isFavorite) {
                    <span> ⭐</span>
                }
            </button>
        }
    </div>
    
    <app-recipe-detail [recipe]="recipe()"></app-recipe-detail>
</div>
