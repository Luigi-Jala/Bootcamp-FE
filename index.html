<!DOCTYPE html>
<html lang="en">
<head>
    <title>Web Component Challenge!</title>
    <script src="Components/Profile.js" defer></script>
    <script src="Components/Logo.js" defer></script>
    <script src="Components/Role.js" defer></script>
    <script src="Components/Card.js" defer></script>
</head>
<body>
    <my-card>
        <my-logo 
            slot="logo" 
            logo-src="https://mma.prnewswire.com/media/2841830/jalasoft_Logo.jpg"
        ></my-logo>

        <my-profile 
            slot="profile" 
            name="Hiratoka Nifuji" 
            profile-src="https://i.pinimg.com/736x/d8/bc/92/d8bc92c9fc5b314a54b3c79dd3444a9c.jpg"
        ></my-profile>

        <my-role 
            slot="role" 
            role-name="Developer"
        ></my-role>
        
        <!-- Hello Slot does will use its default content -->

        <span
            slot="bye-test"
            style="color: rgb(255, 0, 8);"
        >
            Bye as Parameter
        </span>
        
    </my-card>    
</body>
</html>
