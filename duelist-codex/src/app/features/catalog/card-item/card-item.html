<article class="card-item" [appHighlightCard]="card()">
  <button
    type="button"
    class="favorite-btn"
    [class.is-favorite]="isFavorite()"
    (click)="toggleFavorite($event)"
    [title]="isFavorite() ? 'Remove from collection' : 'Add to collection'"
  >
    {{ isFavorite() ? '★' : '☆' }}
  </button>

  @if (imageUrl()) {
    <img class="card-image" [src]="imageUrl()" [alt]="card().name" />
  } @else {
    <div class="missing-image">No image</div>
  }

  <h3>{{ card().name }}</h3>
  <p>{{ readableType() }}</p>

  <a class="view-detail-btn" [routerLink]="['/card', card().id]">View detail</a>
</article>
