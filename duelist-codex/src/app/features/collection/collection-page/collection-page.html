<main class="page">
  <header class="page-header">
    <h1>My Personal Collection</h1>
    <p>View and manage all cards marked as favorites.</p>
  </header>

  <app-search-bar
    [searchTerm]="store.searchTerm()"
    [selectedType]="store.selectedType()"
    [selectedAttribute]="store.selectedAttribute()"
    [selectedRace]="store.selectedRace()"
    (searchChange)="updateSearch($event)"
    (typeChange)="onTypeFilter($event)"
    (attributeChange)="onAttributeFilter($event)"
    (raceChange)="onRaceFilter($event)"
  />

  @if (loading()) {
    <p class="status">Loading your collection...</p>
  } @else if (favoriteCards().length > 0) {
    <p class="result-count">Showing {{ count() }} favorite cards.</p>
    <app-card-grid [cards]="favoriteCards()" />
  } @else {
    <div class="empty-collection">
      <p>No cards in your collection match the current criteria.</p>
      <a routerLink="/catalog" class="btn-catalog">Explore Catalog</a>
    </div>
  }
</main>
